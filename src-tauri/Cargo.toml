[package]
name = "tempo-time"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/HAGerox/Tempo-Time-MacOS"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
